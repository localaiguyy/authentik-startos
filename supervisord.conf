[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgresql]
command=/usr/lib/postgresql/%(ENV_PG_MAJOR)s/bin/postgres -D /root/data/postgres
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/postgresql.log
stderr_logfile=/var/log/supervisor/postgresql_err.log
stopwaitsecs=30

[program:authentik-server]
command=/lifecycle/ak server
directory=/
autostart=true
autorestart=true
priority=40
startsecs=30
stdout_logfile=/var/log/supervisor/authentik-server.log
stderr_logfile=/var/log/supervisor/authentik-server_err.log

[program:authentik-worker]
command=/lifecycle/ak worker
directory=/
autostart=true
autorestart=true
priority=50
startsecs=10
stdout_logfile=/var/log/supervisor/authentik-worker.log
stderr_logfile=/var/log/supervisor/authentik-worker_err.log

[program:authentik-ldap]
command=/app/ldap_outpost_wrapper.sh
directory=/
autostart=%(ENV_AUTHENTIK_LDAP_AUTOSTART)s
autorestart=true
priority=60
startsecs=30
startretries=5
stdout_logfile=/var/log/supervisor/authentik-ldap.log
stderr_logfile=/var/log/supervisor/authentik-ldap_err.log
