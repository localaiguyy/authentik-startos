[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgresql]
command=/usr/lib/postgresql/%(ENV_PG_MAJOR)s/bin/postgres -D /root/data/postgres
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/postgresql.log
stderr_logfile=/var/log/supervisor/postgresql_err.log
stopwaitsecs=30

[program:authentik-server]
command=/lifecycle/ak server
directory=/
autostart=true
autorestart=true
priority=40
startsecs=30
stdout_logfile=/var/log/supervisor/authentik-server.log
stderr_logfile=/var/log/supervisor/authentik-server_err.log

[program:authentik-worker]
command=/lifecycle/ak worker
directory=/
autostart=true
autorestart=true
priority=50
startsecs=10
; Since Authentik 2026.8 the worker binds its own HTTP + metrics listeners.
; Upstream runs server and worker in separate containers so both may use
; 9000/9300; here they share a network namespace, so give the worker its own
; loopback-only ports or it crash-loops with "Address already in use".
; TMPDIR isolation matters for the same reason: both processes derive their
; unix socket paths from temp_dir() ("authentik.sock" etc.), and the worker
; silently re-binding the server's socket breaks the embedded outpost (its
; API client, created after the collision, reaches the worker and gets 404s).
environment=AUTHENTIK_LISTEN__HTTP="127.0.0.1:9001",AUTHENTIK_LISTEN__METRICS="127.0.0.1:9301",TMPDIR="/tmp/authentik-worker"
stdout_logfile=/var/log/supervisor/authentik-worker.log
stderr_logfile=/var/log/supervisor/authentik-worker_err.log

[program:token-ensure]
; One-shot: ensures the package's provisioning API token once the server is
; ready and akadmin exists (created asynchronously by worker blueprints).
command=/app/token_ensure.sh
directory=/
autostart=true
autorestart=false
startsecs=0
priority=70
stdout_logfile=/var/log/supervisor/token-ensure.log
stderr_logfile=/var/log/supervisor/token-ensure_err.log

[program:authentik-ldap]
command=/app/ldap_outpost_wrapper.sh
directory=/
autostart=%(ENV_AUTHENTIK_LDAP_AUTOSTART)s
autorestart=true
priority=60
startsecs=30
startretries=5
stdout_logfile=/var/log/supervisor/authentik-ldap.log
stderr_logfile=/var/log/supervisor/authentik-ldap_err.log
